<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0">
    <title>1945 - Flying Tigers</title>
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background: #0a0a0f;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Press Start 2P', monospace;
            overflow: hidden;
        }
        
        #gameContainer {
            position: relative;
            width: 480px;
            height: 720px;
            border: 4px solid #333;
            box-shadow: 0 0 30px rgba(255, 200, 0, 0.3);
        }
        
        #gameCanvas {
            display: block;
            background: #143C78;
            width: 100%;
            height: 100%;
        }
        
        /* Mobile Control Buttons - BOMB BUTTON ONLY */
        .mobile-controls {
            position: absolute;
            bottom: 60px;
            right: 10px;
            display: none;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        
        /* Show controls on touch devices */
        body.touch-device .mobile-controls {
            display: flex;
        }
        
        .control-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            user-select: none;
            -webkit-user-select: none;
            pointer-events: auto;
            touch-action: manipulation;
            transition: transform 0.1s, background 0.1s;
            cursor: pointer;
        }
        
        .control-btn svg {
            width: 24px;
            height: 24px;
        }
        
        /* Fire button completely hidden - auto-fire is always active on touch */
        #fireBtn {
            display: none !important;
        }
        
        #bombBtn {
            background: rgba(255, 60, 60, 0.4);
            border: 2px solid #FF6B6B;
            color: #FF6B6B;
        }
        
        #bombBtn:active, #bombBtn.pressed {
            background: rgba(255, 60, 60, 0.8);
            transform: scale(0.95);
        }
        
        /* (v24) controls + weapon manual panel removed from the page.
           The in-game help will live inside the game screen itself later. */
        /* Adjust for small screens */
        @media (max-width: 520px) {
            #gameContainer {
                width: 100vw;
                height: calc(100vw * 1.5);
                max-height: 100vh;
                border-width: 2px;
            }
            
            .mobile-controls {
                bottom: 50px;
                right: 8px;
            }
            
            .control-btn {
                width: 45px;
                height: 45px;
            }
            
            .control-btn svg {
                width: 22px;
                height: 22px;
            }
        }
        
        @media (max-height: 750px) and (max-width: 520px) {
            #gameContainer {
                height: 100vh;
                width: calc(100vh / 1.5);
            }
        }
    </style>
</head>
<body>
    <script>
        // Detect touch device and add class
        if ('ontouchstart' in window || navigator.maxTouchPoints > 0) {
            document.body.classList.add('touch-device');
        }
    </script>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="480" height="720"></canvas>
        
        <!-- Mobile Control Buttons - BOMB BUTTON ONLY (no fire button) -->
        <div class="mobile-controls">
            <button id="bombBtn" class="control-btn">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <circle cx="12" cy="14" r="7"/>
                    <path d="M12 7V4M9 5h6"/>
                </svg>
            </button>
        </div>
    </div>
    <!-- (v24) controls + manual panel removed — manual will live inside the game screen later -->
    <!-- (v24) GAME_URL placeholder restored so drawTitleScreen can show the
         SHARE block when the URL is filled in. Leave blank to show the
         setup hint on the title screen instead. -->
    <script>
        // === SHARE URL PLACEHOLDER ==========================================
        // Replace the empty string below with the public URL where this game
        // is hosted (e.g. "https://my-1945.forgedb.app"), save, refresh —
        // the title screen will then display "SHARE THIS GAME: <URL>" in
        // yellow so visitors can copy it and send it to friends. If this
        // stays empty, the title shows a blinking setup hint instead.
        var GAME_URL = '';
    </script>
    <script src="sprites.js"></script>
    <script src="game.js"></script>
</body>
</html>
